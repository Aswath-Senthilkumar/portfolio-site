    <link rel="icon" type="image/png" sizes="144x144" href="/favicon-144x144.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" href="/favicon-192x192.png" />
    <link rel="manifest" href="/manifest.json" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Aswath Senthilkumar",
        "url": "https://ashxprojects.com",
        "jobTitle": "Software Engineer",
        "image": "https://ashxprojects.com/og-image.png",
        "sameAs": [
          "https://www.linkedin.com/in/aswath-senthilkumar",

      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Additional SEO Meta Tags -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- Preload critical above-fold fonts -->
    <link rel="preload" href="/fonts/Azonix.woff" as="font" type="font/woff" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/Inter-Regular.woff" as="font" type="font/woff" crossorigin="anonymous" />
    <title>Aswath Senthilkumar | Portfolio | AshxProjects</title>
    <style>
      /* Inline-critical loader: paints before the JS/CSS bundle executes
         so FCP/LCP fire on this static markup, not after React mount.
         The React app later drives the percentage via getElementById,
         then fades and removes the overlay when the hero is ready.

         Mobile (default): centered, text row + percentage row.
         Desktop (>=768px): bottom-anchored, percentage in bottom-right corner. */
      @font-face {
        font-family: "Azonix";
        src: url("/fonts/Azonix.woff") format("woff");
        font-display: swap;
      }
      @keyframes loader-blink {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
      html, body { margin: 0; padding: 0; background: #000; color: #fff; }
      #static-loader-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: #000;
        font-family: "Azonix", system-ui, -apple-system, sans-serif;
        text-transform: uppercase;
        letter-spacing: -0.025em;
        line-height: 0.95;
        transition: opacity 150ms ease;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 1.5rem;
        text-align: center;
        gap: 2rem;
      }
      #static-loader-overlay.is-fading {
        opacity: 0;
        pointer-events: none;
      }
      #static-loader-overlay .lines {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.1em;
      }
      #static-loader-overlay .line {
        display: block;
        font-size: clamp(2rem, 12vw, 6rem);
        white-space: nowrap;
      }
      #static-loader-overlay .char {
        display: inline-block;
        animation: loader-blink 1.2s ease-in-out infinite;
        will-change: opacity;
      }
      #static-loader-overlay .char-odd { animation-delay: -0.6s; }
      #static-loader-overlay .pct {
        font-size: clamp(1.5rem, 5vw, 3rem);
        opacity: 0.9;
        font-variant-numeric: tabular-nums;
      }
      #static-loader-overlay .pct-symbol {
        margin-left: 0.25rem;
        opacity: 0.6;
      }
      @media (min-width: 768px) {
        #static-loader-overlay {
          justify-content: flex-end;
          align-items: stretch;
          padding: 0 4rem 4rem;
          text-align: left;
          gap: 0;
        }
        #static-loader-overlay .lines {
          align-items: stretch;
        }
        #static-loader-overlay .line {
          font-size: clamp(3rem, 11vw, 13rem);
        }
        #static-loader-overlay .line-2 { padding-left: 2vw; }
        #static-loader-overlay .pct {
          position: absolute;
          right: 4rem;
          top: 4rem;
          font-size: clamp(1.25rem, 2.5vw, 2.5rem);
        }
      }
    </style>
  </head>

  <body>
    <div id="static-loader-overlay" aria-hidden="true">
      <div class="lines">
        <span class="line"
          ><span class="char">L</span><span class="char char-odd">o</span><span class="char">a</span><span class="char char-odd">d</span><span class="char">i</span><span class="char char-odd">n</span><span class="char">g</span></span
        >
        <span class="line line-2"
          ><span class="char">E</span><span class="char char-odd">x</span><span class="char">p</span><span class="char char-odd">e</span><span class="char">r</span><span class="char char-odd">i</span><span class="char">e</span><span class="char char-odd">n</span><span class="char">c</span><span class="char char-odd">e</span></span
        >
      </div>
      <div class="pct">
        <span id="static-loader-pct">0</span><span class="pct-symbol">%</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
